[metadata]
name = fluxthemis
version = attr: fluxthemis.version.__version__
description = Real-robot and simulation evaluation orchestration for FluxVLA
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.10,<3.13
include_package_data = True

[options.extras_require]
dev =
    codespell==2.2.1
    flake8==7.3.0
    isort==5.11.5
    pre-commit==4.5.1
    pytest>=7.4,<8
    yapf==0.43.0

[aliases]
test = pytest

[tool:pytest]
testpaths = test
addopts = -ra

[flake8]
max-line-length = 79
extend-ignore = E203,W503

[yapf]
based_on_style = pep8
blank_line_before_nested_class_or_def = true
split_before_expression_after_opening_paren = true

[isort]
line_length = 79
multi_line_output = 0
known_first_party = fluxthemis
default_section = THIRDPARTY

[codespell]
quiet-level = 3
ignore-words-list = empy,nd,te
