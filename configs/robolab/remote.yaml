version: 1
simulator:
  python: ${ROBOLAB_PYTHON}
  config: droid.py
  robolab_root: ${ROBOLAB_ROOT}
  gpu_ids: [0]
  workers_per_gpu: 1
  task: all
  episodes: null
  scheduling: dynamic
  save_videos: false
  simulator_restart_limit: 0
